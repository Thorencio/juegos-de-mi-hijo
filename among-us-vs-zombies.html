<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Among Us vs Zombies</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(160deg, #0d1f3a, #16334f);
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    touch-action: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; width: 100%;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 560px; padding: 6px 16px; color: #fff;
    font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000;
  }
  #hearts { font-size: 22px; letter-spacing: 2px; }
  #waveLabel { font-size: 18px; }
  #canvasHolder {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 0 8px #6bd4ff, 0 0 30px rgba(107,212,255,0.6);
  }
  canvas { display: block; background: #3f9142; touch-action: none; }
  #waveBanner {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #ffe066; font-size: 26px; font-weight: bold;
    padding: 8px 20px; border-radius: 12px; display: none; text-shadow: 2px 2px 0 #000;
  }
  #msg {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); color: #fff; text-align: center; padding: 20px;
    border-radius: 16px;
  }
  #msg h1 { font-size: 40px; margin: 0 0 10px; }
  #msg p { font-size: 20px; margin: 0 0 20px; }
  #restartBtn {
    background: #4caf50; color: #fff; border: none; padding: 14px 28px;
    font-size: 22px; border-radius: 12px; box-shadow: 0 5px 0 #2e7d32;
    font-family: inherit; font-weight: bold;
  }
  #restartBtn:active { box-shadow: 0 2px 0 #2e7d32; transform: translateY(3px); }
  #hint {
    color: #fff; text-shadow: 1px 1px 0 #000; margin-top: 10px; font-size: 16px; text-align: center;
    max-width: 500px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="hearts">❤️❤️❤️❤️❤️</span>
    <span>🚀 Among Us vs Zombies</span>
    <span id="waveLabel">Oleada 1</span>
  </div>
  <div id="canvasHolder">
    <canvas id="game"></canvas>
    <div id="waveBanner"></div>
    <div id="msg">
      <h1 id="msgTitle">🎉 ¡Ganaron! 🎉</h1>
      <p id="msgText">¡Los Among Us derrotaron a todos los zombies!</p>
      <button id="restartBtn">Jugar de nuevo</button>
    </div>
  </div>
  <div id="hint">Toca un espacio de pasto para poner un Among Us. Tócalo de nuevo para quitarlo.</div>
</div>

<script>
// ---------- Configuración del tablero ----------
const cols = 10, rows = 7, TILE = 48;

// Camino (celdas por las que caminan los zombies), en orden desde la entrada hasta el objetivo
const path = [
  {r:1,c:0},{r:1,c:1},{r:1,c:2},{r:1,c:3},{r:1,c:4},
  {r:2,c:4},{r:3,c:4},
  {r:3,c:5},{r:3,c:6},{r:3,c:7},{r:3,c:8},
  {r:4,c:8},{r:5,c:8},
  {r:5,c:7},{r:5,c:6},{r:5,c:5},{r:5,c:4},{r:5,c:3},{r:5,c:2},{r:5,c:1},
  {r:6,c:1}
];
const pathSet = new Set(path.map(p => p.r + '_' + p.c));

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = cols * TILE;
canvas.height = rows * TILE;

const crewColors = ['#ff4d4d', '#4da6ff', '#3ddc84', '#ffd23d', '#ff8fd6', '#ff9f43', '#9b6bff'];

let crewmates = []; // {r,c,color,cooldown}
let zombies = [];   // {progress (float index along path), hp, maxHp, speed, id}
let projectiles = []; // {x,y,targetX,targetY,speed}
let hearts = 5;
let waveIndex = 0;
let zombiesToSpawn = 0;
let spawnTimer = 0;
let gameOver = false;
let gameWon = false;
let betweenWaves = false;
let betweenWaveTimer = 0;
let zombieIdCounter = 0;
let particles = []; // small star effects on kill

const waves = [
  { count: 5,  hp: 2, speed: 0.55, spawnGap: 1.3 },
  { count: 8,  hp: 3, speed: 0.65, spawnGap: 1.1 },
  { count: 12, hp: 3, speed: 0.8,  spawnGap: 0.9 },
];

function cellCenter(r, c) {
  return { x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 };
}

function isPathCell(r, c) {
  return pathSet.has(r + '_' + c);
}

function updateHearts() {
  document.getElementById('hearts').textContent = '❤️'.repeat(Math.max(hearts, 0)) + '🖤'.repeat(Math.max(5 - hearts, 0));
}

function updateWaveLabel() {
  document.getElementById('waveLabel').textContent = 'Oleada ' + (waveIndex + 1) + ' / ' + waves.length;
}

function showWaveBanner(text) {
  const el = document.getElementById('waveBanner');
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 1600);
}

function startWave(i) {
  waveIndex = i;
  const w = waves[i];
  zombiesToSpawn = w.count;
  spawnTimer = 0;
  betweenWaves = false;
  updateWaveLabel();
  showWaveBanner('¡Oleada ' + (i + 1) + '!');
}

function spawnZombie() {
  const w = waves[waveIndex];
  zombies.push({
    id: zombieIdCounter++,
    progress: 0,
    hp: w.hp,
    maxHp: w.hp,
    speed: w.speed,
  });
}

// ---------- Interacción táctil: colocar / quitar Among Us ----------
function getCellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  const x = (clientX - rect.left) * (canvas.width / rect.width);
  const y = (clientY - rect.top) * (canvas.height / rect.height);
  return { r: Math.floor(y / TILE), c: Math.floor(x / TILE) };
}

function handleTap(e) {
  e.preventDefault();
  if (gameOver || gameWon) return;
  const { r, c } = getCellFromEvent(e);
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (isPathCell(r, c)) return;

  const existingIdx = crewmates.findIndex(cm => cm.r === r && cm.c === c);
  if (existingIdx >= 0) {
    crewmates.splice(existingIdx, 1);
    return;
  }
  const color = crewColors[crewmates.length % crewColors.length];
  crewmates.push({ r, c, color, cooldown: 0, range: TILE * 1.9, damage: 1, fireRate: 0.6 });
}

canvas.addEventListener('touchstart', handleTap);
canvas.addEventListener('mousedown', handleTap);

// ---------- Lógica de disparo ----------
function updateCrewmates(dt) {
  crewmates.forEach(cm => {
    cm.cooldown -= dt;
    if (cm.cooldown > 0) return;
    const center = cellCenter(cm.r, cm.c);
    let target = null;
    let bestProgress = -1;
    zombies.forEach(z => {
      const zp = zombiePixelPos(z);
      const dist = Math.hypot(zp.x - center.x, zp.y - center.y);
      if (dist <= cm.range && z.progress > bestProgress) {
        bestProgress = z.progress;
        target = z;
      }
    });
    if (target) {
      const zp = zombiePixelPos(target);
      projectiles.push({
        x: center.x, y: center.y,
        targetId: target.id,
        speed: 320,
      });
      cm.cooldown = cm.fireRate;
    }
  });
}

function zombiePixelPos(z) {
  const idx = Math.min(Math.floor(z.progress), path.length - 2);
  const t = z.progress - idx;
  const a = cellCenter(path[idx].r, path[idx].c);
  const b = cellCenter(path[idx + 1].r, path[idx + 1].c);
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function updateZombies(dt) {
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    z.progress += z.speed * dt;
    if (z.progress >= path.length - 1) {
      zombies.splice(i, 1);
      hearts = Math.max(0, hearts - 1);
      updateHearts();
      if (hearts <= 0) {
        triggerGameOver();
      }
    }
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    const target = zombies.find(z => z.id === p.targetId);
    if (!target) { projectiles.splice(i, 1); continue; }
    const zp = zombiePixelPos(target);
    const dx = zp.x - p.x, dy = zp.y - p.y;
    const dist = Math.hypot(dx, dy);
    const move = p.speed * dt;
    if (dist <= move) {
      target.hp -= 1;
      projectiles.splice(i, 1);
      if (target.hp <= 0) {
        particles.push({ x: zp.x, y: zp.y, life: 0.5 });
        zombies = zombies.filter(z => z.id !== target.id);
      }
      continue;
    }
    p.x += (dx / dist) * move;
    p.y += (dy / dist) * move;
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].life -= dt;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

function triggerGameOver() {
  gameOver = true;
  document.getElementById('msgTitle').textContent = '👻 ¡Los zombies llegaron!';
  document.getElementById('msgText').textContent = 'No te preocupes, inténtalo de nuevo.';
  document.getElementById('msg').style.display = 'flex';
}

function triggerWin() {
  gameWon = true;
  document.getElementById('msgTitle').textContent = '🎉 ¡Ganaron! 🎉';
  document.getElementById('msgText').textContent = '¡Los Among Us derrotaron a todos los zombies!';
  document.getElementById('msg').style.display = 'flex';
}

// ---------- Dibujo ----------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Pasto
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#3f9142' : '#469a48';
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }
  // Camino
  path.forEach((p, i) => {
    ctx.fillStyle = '#d8c48a';
    ctx.fillRect(p.c * TILE, p.r * TILE, TILE, TILE);
  });
  // Objetivo (última celda del camino)
  const goal = path[path.length - 1];
  const gCenter = cellCenter(goal.r, goal.c);
  ctx.font = (TILE * 0.8) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏠', gCenter.x, gCenter.y);

  // Entrada
  const start = path[0];
  const sCenter = cellCenter(start.r, start.c);
  ctx.font = (TILE * 0.6) + 'px sans-serif';
  ctx.fillText('☣️', sCenter.x, sCenter.y);

  // Among Us (crewmates)
  crewmates.forEach(cm => drawCrewmate(cellCenter(cm.r, cm.c), cm.color));

  // Zombies
  zombies.forEach(z => drawZombie(zombiePixelPos(z), z.hp, z.maxHp));

  // Proyectiles
  ctx.fillStyle = '#fff27a';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  // Particulas de muerte
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(pt.life / 0.5, 0);
    ctx.font = '22px sans-serif';
    ctx.fillText('⭐', pt.x, pt.y - (0.5 - pt.life) * 20);
    ctx.globalAlpha = 1;
  });
}

function drawCrewmate(center, color) {
  const x = center.x, y = center.y;
  const w = TILE * 0.5, h = TILE * 0.62;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // mochila
  ctx.fillStyle = color;
  ctx.fillRect(x - w / 2 - 4, y - h / 4, 6, h / 2.2);
  // visor
  ctx.fillStyle = '#bfe9ff';
  ctx.beginPath();
  ctx.ellipse(x + 4, y - h / 6, w / 3, h / 4.5, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawZombie(pos, hp, maxHp) {
  const x = pos.x, y = pos.y;
  const r = TILE * 0.28;
  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x - 6, y - 3, 3.5, 0, Math.PI * 2);
  ctx.arc(x + 6, y - 3, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#8b0000';
  ctx.beginPath();
  ctx.arc(x - 6, y - 3, 1.6, 0, Math.PI * 2);
  ctx.arc(x + 6, y - 3, 1.6, 0, Math.PI * 2);
  ctx.fill();
  // vida
  const barW = TILE * 0.55;
  ctx.fillStyle = '#222';
  ctx.fillRect(x - barW / 2, y - r - 10, barW, 5);
  ctx.fillStyle = '#7CFC00';
  ctx.fillRect(x - barW / 2, y - r - 10, barW * (hp / maxHp), 5);
}

// ---------- Bucle principal ----------
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (!gameOver && !gameWon) {
    if (zombiesToSpawn > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnZombie();
        zombiesToSpawn--;
        spawnTimer = waves[waveIndex].spawnGap;
      }
    }

    updateCrewmates(dt);
    updateZombies(dt);
    updateProjectiles(dt);
    updateParticles(dt);

    if (!gameOver && zombiesToSpawn === 0 && zombies.length === 0 && !betweenWaves) {
      betweenWaves = true;
      betweenWaveTimer = 1.6;
    }
    if (betweenWaves) {
      betweenWaveTimer -= dt;
      if (betweenWaveTimer <= 0) {
        if (waveIndex + 1 < waves.length) {
          startWave(waveIndex + 1);
        } else {
          triggerWin();
        }
      }
    }

    draw();
  }
  requestAnimationFrame(gameLoop);
}

// ---------- Reinicio ----------
document.getElementById('restartBtn').addEventListener('click', resetGame);

function resetGame() {
  crewmates = [];
  zombies = [];
  projectiles = [];
  particles = [];
  hearts = 5;
  gameOver = false;
  gameWon = false;
  betweenWaves = false;
  zombieIdCounter = 0;
  updateHearts();
  document.getElementById('msg').style.display = 'none';
  startWave(0);
}

updateHearts();
startWave(0);
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
