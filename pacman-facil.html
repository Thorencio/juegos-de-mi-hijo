<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pacman Fácil</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(160deg, #1a1a4e, #3a1a6e);
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    touch-action: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; width: 100%;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 500px; padding: 8px 16px; color: #fff;
    font-size: 22px; font-weight: bold; text-shadow: 2px 2px 0 #000;
  }
  #canvasHolder {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 0 8px #ffcc00, 0 0 30px rgba(255,204,0,0.6);
  }
  canvas { display: block; background: #000; }
  #controls {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px 70px;
    gap: 6px;
    margin-top: 14px;
  }
  .btn {
    background: #ffcc00;
    border: none;
    border-radius: 18px;
    font-size: 30px;
    color: #1a1a4e;
    box-shadow: 0 5px 0 #b38f00;
    display: flex; align-items: center; justify-content: center;
    active-state: none;
  }
  .btn:active { box-shadow: 0 2px 0 #b38f00; transform: translateY(3px); }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }
  #msg {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); color: #fff; text-align: center; padding: 20px;
    border-radius: 16px;
  }
  #msg h1 { font-size: 46px; margin: 0 0 10px; }
  #msg p { font-size: 22px; margin: 0 0 20px; }
  #restartBtn {
    background: #4caf50; color: #fff; border: none; padding: 14px 28px;
    font-size: 22px; border-radius: 12px; box-shadow: 0 5px 0 #2e7d32;
    font-family: inherit; font-weight: bold;
  }
  #restartBtn:active { box-shadow: 0 2px 0 #2e7d32; transform: translateY(3px); }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>⭐ <span id="score">0</span></span>
    <span>🟡 Pacman Fácil</span>
  </div>
  <div id="canvasHolder">
    <canvas id="game"></canvas>
    <div id="msg">
      <h1 id="msgTitle">🎉 ¡Ganaste! 🎉</h1>
      <p id="msgText">¡Comiste todos los puntitos!</p>
      <button id="restartBtn">Jugar de nuevo</button>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="up">⬆️</button>
    <button class="btn" id="left">⬅️</button>
    <button class="btn" id="right">➡️</button>
    <button class="btn" id="down">⬇️</button>
  </div>
</div>

<script>
// ---------- Mapa sencillo (0 = pared, 1 = camino con punto, 2 = camino vacío) ----------
const map = [
"0000000000000",
"0111111111110",
"0100010001010",
"0101110111010",
"0100000000010",
"0101110111010",
"0100010001010",
"0111111111110",
"0100000000010",
"0101011101010",
"0100010001010",
"0111111111110",
"0000000000000",
];

const rows = map.length;
const cols = map[0].length;
const TILE = 34;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = cols * TILE;
canvas.height = rows * TILE;

let grid = [];
let totalDots = 0;
let score = 0;
let gameWon = false;

function loadMap() {
  grid = [];
  totalDots = 0;
  for (let r = 0; r < rows; r++) {
    grid.push(map[r].split('').map(ch => parseInt(ch)));
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] === 1) totalDots++;
    }
  }
}

// ---------- Pacman ----------
let pac = { r: 1, c: 1, dir: 'right', mouth: 0 };

// ---------- Fantasmas amigables (no matan, solo se mueven despacito) ----------
let ghosts = [
  { r: 5, c: 5, color: '#ff6b6b', timer: 0, dir: 'up' },
  { r: 9, c: 9, color: '#8e6bff', timer: 0, dir: 'down' },
];

function isWalkable(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return false;
  return grid[r][c] !== 0;
}

function tryMovePac(dr, dc, dir) {
  const nr = pac.r + dr;
  const nc = pac.c + dc;
  if (isWalkable(nr, nc)) {
    pac.r = nr;
    pac.c = nc;
    pac.dir = dir;
    if (grid[nr][nc] === 1) {
      grid[nr][nc] = 2;
      score++;
      document.getElementById('score').textContent = score;
      if (score >= totalDots) {
        winGame();
      }
    }
  }
}

function moveGhosts() {
  const dirs = [
    { dr: -1, dc: 0, name: 'up' },
    { dr: 1, dc: 0, name: 'down' },
    { dr: 0, dc: -1, name: 'left' },
    { dr: 0, dc: 1, name: 'right' },
  ];
  ghosts.forEach(g => {
    // Movimiento aleatorio lento, evita callejones sin salida cuando puede
    const options = dirs.filter(d => isWalkable(g.r + d.dr, g.c + d.dc));
    if (options.length > 0) {
      // prefiere mantener dirección si es posible, si no elige al azar
      let choice = options.find(o => o.name === g.dir);
      if (!choice || Math.random() < 0.35) {
        choice = options[Math.floor(Math.random() * options.length)];
      }
      g.r += choice.dr;
      g.c += choice.dc;
      g.dir = choice.name;
    }
  });
}

// ---------- Dibujo ----------
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Paredes y puntos
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * TILE, y = r * TILE;
      if (grid[r][c] === 0) {
        ctx.fillStyle = '#1e2a78';
        ctx.fillRect(x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(x, y, TILE, TILE);
        if (grid[r][c] === 1) {
          ctx.fillStyle = '#ffe066';
          ctx.beginPath();
          ctx.arc(x + TILE / 2, y + TILE / 2, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // Fantasmas
  ghosts.forEach(g => {
    drawGhost(g.c * TILE + TILE / 2, g.r * TILE + TILE / 2, g.color);
  });

  // Pacman
  drawPac(pac.c * TILE + TILE / 2, pac.r * TILE + TILE / 2, pac.dir);
}

function drawPac(cx, cy, dir) {
  const radius = TILE / 2 - 3;
  pac.mouth = (pac.mouth + 0.15) % (Math.PI / 2);
  const mouthAngle = Math.abs(Math.sin(pac.mouth * 2)) * 0.28 + 0.05;
  let startAngle, endAngle, rot;
  rot = { right: 0, down: 90, left: 180, up: 270 }[dir] * Math.PI / 180;
  startAngle = rot + mouthAngle;
  endAngle = rot - mouthAngle + Math.PI * 2;

  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, startAngle, endAngle);
  ctx.closePath();
  ctx.fill();
}

function drawGhost(cx, cy, color) {
  const r = TILE / 2 - 4;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy - 2, r, Math.PI, 0, false);
  ctx.lineTo(cx + r, cy + r);
  for (let i = 0; i < 3; i++) {
    ctx.lineTo(cx + r - (i + 1) * (2 * r / 3), cy + r - 6);
    ctx.lineTo(cx + r - (i + 1.5) * (2 * r / 3), cy + r);
  }
  ctx.closePath();
  ctx.fill();

  // ojos
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 4, 5, 0, Math.PI * 2);
  ctx.arc(cx + 6, cy - 4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 4, 2.2, 0, Math.PI * 2);
  ctx.arc(cx + 6, cy - 4, 2.2, 0, Math.PI * 2);
  ctx.fill();
}

// ---------- Controles ----------
function setupButton(id, dr, dc, dir) {
  const el = document.getElementById(id);
  const handler = (e) => { e.preventDefault(); tryMovePac(dr, dc, dir); };
  el.addEventListener('touchstart', handler);
  el.addEventListener('mousedown', handler);
}
setupButton('up', -1, 0, 'up');
setupButton('down', 1, 0, 'down');
setupButton('left', 0, -1, 'left');
setupButton('right', 0, 1, 'right');

window.addEventListener('keydown', (e) => {
  if (gameWon) return;
  if (e.key === 'ArrowUp') tryMovePac(-1, 0, 'up');
  if (e.key === 'ArrowDown') tryMovePac(1, 0, 'down');
  if (e.key === 'ArrowLeft') tryMovePac(0, -1, 'left');
  if (e.key === 'ArrowRight') tryMovePac(0, 1, 'right');
});

// ---------- Ciclo del juego ----------
function winGame() {
  gameWon = true;
  document.getElementById('msgTitle').textContent = '🎉 ¡Ganaste! 🎉';
  document.getElementById('msgText').textContent = '¡Comiste todos los puntitos, muy bien hecho!';
  document.getElementById('msg').style.display = 'flex';
}

document.getElementById('restartBtn').addEventListener('click', resetGame);

function resetGame() {
  loadMap();
  pac = { r: 1, c: 1, dir: 'right', mouth: 0 };
  ghosts = [
    { r: 5, c: 5, color: '#ff6b6b', timer: 0, dir: 'up' },
    { r: 9, c: 9, color: '#8e6bff', timer: 0, dir: 'down' },
  ];
  score = 0;
  gameWon = false;
  document.getElementById('score').textContent = score;
  document.getElementById('msg').style.display = 'none';
}

let ghostMoveCounter = 0;
function gameLoop() {
  if (!gameWon) {
    ghostMoveCounter++;
    if (ghostMoveCounter % 40 === 0) { // fantasmas MUY lentos, sin peligro real
      moveGhosts();
    }
    draw();
  }
  requestAnimationFrame(gameLoop);
}

loadMap();
gameLoop();
</script>
</body>
</html>
